# Pruebas automáticas: corren solas cada vez que se sube un cambio (pestaña Actions del repositorio).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Código y app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Revisar el código (ESLint)
        run: npm run lint
      - name: Motor, aprendizaje y guardado
        run: npm run motor
      - name: Pantalla, accesibilidad y tamaños
        run: npm run ui
        env:
          CAPTURAS: capturas
      - name: Instalar, sin internet y actualización
        run: npm run instalar
      - name: Gemini (simulado)
        run: npm run gemini
      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: capturas
          retention-days: 7
          if-no-files-found: ignore
